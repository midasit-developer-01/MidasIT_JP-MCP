[project]
name = "midas-mcp-server"
version = "0.1.0"
description = "MCP server for the MIDAS NX (CIVIL/GEN) Open API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
    "requests>=2.31.0",
    "jsonschema>=4.0.0",
]

[project.scripts]
midas-mcp = "midas_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["midas_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"data" = "data"
