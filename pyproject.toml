[project]
name = "midas-mcp-server"
version = "0.1.0"
description = "MCP server for the MIDAS NX (CIVIL/GEN) Open API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Cap below 2.0: mcp 2.x moved/removed `mcp.server.fastmcp`, which server.py
    # imports. The unpinned ">=1.2.0" let container builds pull 2.0 and crash on
    # startup while the pinned local venv (1.28.1) stayed fine. <2 keeps 1.x.
    "mcp[cli]>=1.2.0,<2",
    "requests>=2.31.0",
    "jsonschema>=4.0.0",
]

[project.scripts]
midas-mcp = "midas_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["midas_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"data" = "data"
